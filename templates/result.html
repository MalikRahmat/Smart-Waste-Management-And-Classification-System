<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classification Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/static/icon_images/icons/mainLogo.svg">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="app-header">

    <!-- Branding -->
    <div class="brand">
      <img src="/static/icon_images/icons/result.png" alt="Recycle" class="brand-icon">
      <h1>Result</h1>
    </div>

    <!-- Mobile menu toggle -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- Navigation -->
    <nav class="nav" id="navMenu">
      <a href="/" class="nav-link">Home</a>
      <a href="/history" class="nav-link">History</a>
      <a href="/admin" class="nav-link">Admin</a>
      <a href="/admin/logs" class="nav-link">Logs</a>
      <a href="/admin/eval" class="nav-link">Evaluation</a>
    </nav>

  </header>

  <!-- ================= MAIN ================= -->
  <main class="container">

    <!-- ===== RESULT DISPLAY SECTION ===== -->
    <section class="card result-card">

      <div class="result-grid">

        <!-- Classified image preview -->
        <div class="image-box">
          <img src="{{ image_url }}" alt="Classified image" class="preview-img">
        </div>

        <!-- Classification details -->
        <div class="info-box">

          <!-- Category and confidence badges -->
          <div class="badge-group">
            <span class="badge category">
              {{ predicted_class|capitalize }}
            </span>

            <span class="badge confidence">
              Confidence: {{ confidence }}%
            </span>
          </div>

          <!-- Confidence progress bar -->
          <div class="progress-bar">
            <div class="progress" style="width: {{ confidence }}%"></div>
          </div>

          <!-- Recommended disposal action -->
          <h3>Recommended action</h3>
          <p class="recommend">{{ recommendation }}</p>

          <!-- Action buttons -->
          <div class="actions">
            <a href="/" class="btn primary">Classify another</a>
            <a href="/history" class="btn">View history</a>
          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="app-footer">
    <p>Promoting responsible disposal and recycling.</p>
  </footer>

  <!-- Main JS -->
  <script src="/static/js/script.js"></script>

</body>
</html>
