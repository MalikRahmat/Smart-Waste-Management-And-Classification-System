<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#ffffff"></rect>

  <!-- Recycling Circle -->
  <circle cx="256" cy="256" r="150" stroke="#22c55e" stroke-width="40" fill="none"></circle>

  <!-- AI Circuit Nodes -->
  <circle cx="256" cy="120" r="18" fill="#2563eb"></circle>
  <circle cx="380" cy="256" r="18" fill="#2563eb"></circle>
  <circle cx="256" cy="392" r="18" fill="#2563eb"></circle>
  <circle cx="132" cy="256" r="18" fill="#2563eb"></circle>

  <!-- Connecting Lines -->
  <line x1="256" y1="120" x2="380" y2="256" stroke="#2563eb" stroke-width="10"></line>
  <line x1="380" y1="256" x2="256" y2="392" stroke="#2563eb" stroke-width="10"></line>
  <line x1="256" y1="392" x2="132" y2="256" stroke="#2563eb" stroke-width="10"></line>
  <line x1="132" y1="256" x2="256" y2="120" stroke="#2563eb" stroke-width="10"></line>

</svg>